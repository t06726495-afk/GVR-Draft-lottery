<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GVR Draft Lottery</title>
<style>
/* ============================================================
   GVR DRAFT LOTTERY — single file, no dependencies
   Fixed 432 x 768 stage (9:16) scaled to fit any screen.
   ============================================================ */

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#04070e;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-family:"Arial Black","Helvetica Neue",Impact,sans-serif;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}

:root{
  --gold:#f3c34a;
  --gold-lt:#ffe89a;
  --gold-dk:#9c6f13;
  --red:#c9192b;
  --red-dk:#7d0c18;
  --red-lt:#ef4459;
  --navy:#0a1428;
  --chrome-lt:#f2f5f8;
  --chrome:#b9c2cc;
  --chrome-dk:#5c6674;
  --ink:#12161d;
}

/* ---------- stage ---------- */
#stage{
  position:absolute;width:432px;height:768px;transform-origin:top left;
  background:
    radial-gradient(120% 70% at 50% -10%, #1b3766 0%, #0d1c39 38%, #060c1a 70%, #04070e 100%);
  overflow:hidden;
}
/* stadium glow blobs */
.blob{position:absolute;border-radius:50%;filter:blur(34px);opacity:.55;pointer-events:none}
.b1{width:190px;height:190px;left:-60px;top:70px;background:#2f6bd4;animation:drift 13s ease-in-out infinite}
.b2{width:230px;height:230px;right:-80px;top:180px;background:#1f8ad0;opacity:.4;animation:drift 17s ease-in-out infinite reverse}
.b3{width:300px;height:150px;left:50%;bottom:-40px;transform:translateX(-50%);background:#0d5f8a;opacity:.35;animation:drift 21s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,-18px)}}
.b3{animation-name:drift3}
@keyframes drift3{0%,100%{transform:translateX(-50%)}50%{transform:translateX(-46%) translateY(-14px)}}

/* field haze at the bottom */
.field{position:absolute;left:0;right:0;bottom:0;height:190px;pointer-events:none;
  background:linear-gradient(to top, rgba(18,52,36,.55), rgba(10,26,20,.18) 55%, transparent);
}
.field::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 46px);
  mask-image:linear-gradient(to top, #000, transparent);
  -webkit-mask-image:linear-gradient(to top, #000, transparent);
}
/* sparkle stars */
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#cfe6ff;opacity:.7;
  box-shadow:0 0 6px 1px rgba(160,210,255,.85);animation:tw 3.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:.95;transform:scale(1.2)}}

.wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  padding:6px 12px 8px;z-index:3}

/* ---------- marquee ---------- */
.marquee{position:relative;width:396px;flex:0 0 auto}
.topper{position:relative;margin:0 auto -7px;width:196px;height:50px;z-index:4;
  display:flex;align-items:center;justify-content:center}
.topper .arch{position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:196px;height:50px;border-radius:100px 100px 0 0;
  border:4px solid transparent;
  background:linear-gradient(#7a5a10,#33240a) padding-box,
             linear-gradient(180deg,#ffe89a,#c99a24 45%,#7d5a0d) border-box;
  border-bottom:none;box-shadow:0 0 16px rgba(255,190,60,.35)}
#topperNum{position:relative;z-index:5;font-size:34px;line-height:1;margin-top:5px;
  color:#ffdf7e;letter-spacing:1px;
  text-shadow:0 0 6px #fff3c4,0 0 18px #ffb020,0 0 40px #ff8a00,0 3px 0 #7d5a0d;
  -webkit-text-stroke:2px #6d4c07;
  transition:transform .18s cubic-bezier(.3,1.7,.5,1)}
#topperNum.pop{transform:scale(1.28)}

.board-frame{position:relative;border-radius:14px;padding:10px;
  background:linear-gradient(180deg,#e0b23f,#a3761b 40%,#c99a24 60%,#6d4c07);
  box-shadow:0 0 0 2px #4a3406, 0 10px 26px rgba(0,0,0,.6), inset 0 0 14px rgba(255,235,170,.35);
}
.board-frame::before{content:"";position:absolute;inset:5px;border-radius:11px;
  border:2px solid rgba(120,20,26,.85);pointer-events:none}
.matrix{position:relative;border-radius:8px;overflow:hidden;
  background:linear-gradient(180deg,#191b22,#0d0f14);
  box-shadow:inset 0 3px 12px rgba(0,0,0,.9);
  padding:7px 8px 8px}
.matrix::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background-image:radial-gradient(circle at 50% 50%, rgba(0,0,0,.62) 40%, transparent 43%);
  background-size:4px 4px}
.mq-text{position:relative;z-index:2;text-align:center;line-height:.94;
  font-size:31px;letter-spacing:1.3px;
  color:#ff8b2e;
  text-shadow:0 0 4px #ffd08a, 0 0 14px #ff6a10, 0 0 34px #ff4d00;
  -webkit-text-stroke:1px #ffcf92;
  animation:mqglow 3.6s ease-in-out infinite}
@keyframes mqglow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.16)}}

/* bulbs */
.bulb{position:absolute;width:7px;height:7px;border-radius:50%;margin:-3.5px 0 0 -3.5px;
  background:radial-gradient(circle at 35% 30%, #fffdf0, #ffd66a 45%, #d98f12 78%, #7c4f06);
  box-shadow:0 0 7px 2px rgba(255,196,80,.9);
  animation:blink 1.15s steps(1,end) infinite;z-index:5}
.bulb.odd{animation-delay:.575s}
@keyframes blink{0%,49%{opacity:1;filter:brightness(1.15)}50%,100%{opacity:.35;filter:brightness(.6)}}
.hot .bulb{animation-duration:.24s}

/* ---------- cabinet ---------- */
.machine-area{position:relative;width:408px;margin-top:10px;flex:0 0 auto}
.machine{position:relative;width:344px;margin:0 auto;border-radius:20px 20px 12px 12px;
  padding:8px 9px 10px;
  background:
    linear-gradient(180deg,#fdfefe 0%,#d3dae1 6%,#98a3af 16%,#e8edf1 22%,#aab4c0 40%,
                    #7e8894 72%,#c7ced6 88%,#6f7883 100%);
  box-shadow:0 14px 30px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.9),
             inset 0 -2px 6px rgba(0,0,0,.45), 0 0 0 1px #444d59;
}
.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{
  10%,90%{transform:translate3d(-2px,1px,0) rotate(-.25deg)}
  20%,80%{transform:translate3d(4px,-2px,0) rotate(.35deg)}
  30%,50%,70%{transform:translate3d(-6px,2px,0) rotate(-.45deg)}
  40%,60%{transform:translate3d(6px,-1px,0) rotate(.45deg)}
  100%{transform:none}
}
/* red light rails */
.rail{position:absolute;top:52px;bottom:60px;width:13px;border-radius:7px;
  background:linear-gradient(180deg,#8f1220,#c9192b 30%,#7d0c18);
  box-shadow:inset 0 0 6px rgba(0,0,0,.6)}
.rail.l{left:-2px}.rail.r{right:-2px}
.rail .bulb{width:6px;height:6px;left:50%;box-shadow:0 0 6px 2px rgba(255,150,60,.85)}

/* readouts */
.readouts{display:flex;gap:8px;align-items:stretch;
  background:linear-gradient(180deg,#8f1220,#4d0810);border-radius:8px;padding:4px;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.35)}
.readout{flex:1;background:#120507;border-radius:5px;padding:3px 6px;text-align:center;
  border:1px solid #3d0a10;box-shadow:inset 0 0 10px rgba(255,40,40,.18)}
.readout span{font-size:9px;letter-spacing:1.5px;color:#e9c46a;display:block}
.readout b{display:block;font-size:16px;line-height:1.05;color:#ff3b30;
  font-family:"Courier New",monospace;letter-spacing:2px;
  text-shadow:0 0 8px rgba(255,60,50,.9)}

/* reel */
.reel-frame{position:relative;margin-top:7px;border-radius:12px;padding:7px 24px;
  background:linear-gradient(180deg,#2a3038,#171b21);
  box-shadow:inset 0 0 0 2px rgba(220,190,120,.35), inset 0 4px 14px rgba(0,0,0,.75)}
.reel-window{position:relative;height:168px;border-radius:6px;overflow:hidden;
  background:linear-gradient(180deg,#c9cfd6,#f4f6f8 12%,#fff 50%,#eef1f4 88%,#b9c1c9);
  box-shadow:inset 0 8px 14px rgba(0,0,0,.35), inset 0 -8px 14px rgba(0,0,0,.3)}
.reel-strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.cell{height:56px;display:flex;align-items:center;justify-content:center;
  font-family:Georgia,"Times New Roman",serif;font-weight:700;
  font-size:34px;color:#14181f;letter-spacing:.5px;
  border-bottom:1px solid rgba(0,0,0,.07)}
.cell.dim{color:#8b929b}
.reel-strip.blur .cell{filter:blur(1.6px)}
.reel-strip.blur2 .cell{filter:blur(3.4px)}

.payline{position:absolute;left:0;right:0;top:56px;height:56px;pointer-events:none;
  border-top:2px solid rgba(201,25,43,.75);border-bottom:2px solid rgba(201,25,43,.75);
  background:linear-gradient(90deg,rgba(243,195,74,.20),rgba(255,255,255,0) 22%,
             rgba(255,255,255,0) 78%,rgba(243,195,74,.20));
  box-shadow:0 0 18px rgba(243,195,74,.25) inset;z-index:3}
.payline.win{animation:winline .8s ease-out}
@keyframes winline{
  0%{background:rgba(255,255,255,.98);box-shadow:0 0 60px 20px rgba(255,236,170,.95) inset}
  40%{background:rgba(255,226,140,.55)}
  100%{background:linear-gradient(90deg,rgba(243,195,74,.20),transparent 22%,transparent 78%,rgba(243,195,74,.20))}
}
.cell.win{color:#8a1220;text-shadow:0 0 18px rgba(255,180,60,.95),0 0 40px rgba(255,120,0,.6);
  animation:winpop .8s cubic-bezier(.2,1.6,.4,1)}
@keyframes winpop{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1.06)}}
.glass{position:absolute;inset:0;pointer-events:none;z-index:4;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 26%,
             rgba(0,0,0,.06) 70%,rgba(0,0,0,.16));
  border-radius:6px}
/* pointers */
.arrow{position:absolute;top:50%;margin-top:-13px;width:0;height:0;
  border-top:13px solid transparent;border-bottom:13px solid transparent;z-index:5;
  filter:drop-shadow(0 0 5px rgba(255,90,60,.8))}
.arrow.l{left:5px;border-left:17px solid #e0342c}
.arrow.r{right:5px;border-right:17px solid #e0342c}

/* deck */
.deck{margin-top:7px;display:flex;align-items:center;justify-content:center;gap:12px;
  background:linear-gradient(180deg,#4c545e,#2b3138 45%,#3d444d);
  border-radius:10px;padding:6px 12px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 8px rgba(0,0,0,.6),
             0 0 0 1px rgba(243,195,74,.28)}
.aux{width:40px;height:28px;border:none;border-radius:6px;cursor:pointer;color:#ffe6a8;
  font-size:11px;letter-spacing:1px;font-family:inherit;
  background:linear-gradient(180deg,#d43a2a,#8b1a14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 3px 0 #4d0d09, 0 4px 8px rgba(0,0,0,.5)}
.aux:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 0 #4d0d09}
.aux.gold{background:linear-gradient(180deg,#f0cf6a,#b8860f);color:#3b2600;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 3px 0 #6b4c05,0 4px 8px rgba(0,0,0,.5)}

.spin-btn{position:relative;width:72px;height:72px;border-radius:50%;border:none;cursor:pointer;
  font-family:inherit;font-size:17px;letter-spacing:1px;color:#fff8e6;
  background:radial-gradient(circle at 38% 30%, #ff6a5e 0%, #e12a2a 38%, #a10f18 72%, #6d060e 100%);
  text-shadow:0 2px 3px rgba(0,0,0,.6),0 0 12px rgba(255,180,120,.6);
  box-shadow:
    0 0 0 5px #2c3138,
    0 0 0 10px #f0cf6a,
    0 0 0 12px #8b6410,
    inset 0 4px 10px rgba(255,255,255,.45),
    inset 0 -8px 16px rgba(0,0,0,.55),
    0 9px 0 #5c0810,
    0 12px 24px rgba(0,0,0,.65),
    0 0 26px rgba(255,90,60,.45);
  transition:transform .07s, box-shadow .07s;margin:0 2px}
.spin-btn:hover:not(:disabled){filter:brightness(1.08)}
.spin-btn:active:not(:disabled),.spin-btn.press{transform:translateY(7px);
  box-shadow:0 0 0 5px #2c3138,0 0 0 10px #f0cf6a,0 0 0 12px #8b6410,
    inset 0 4px 10px rgba(255,255,255,.3),inset 0 -4px 12px rgba(0,0,0,.6),
    0 2px 0 #5c0810,0 4px 10px rgba(0,0,0,.6)}
.spin-btn:disabled{cursor:default;filter:saturate(.45) brightness(.72)}
.spin-btn.ready{animation:pulse 1.9s ease-in-out infinite}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.22)}}

/* ribbon + result */
.ribbon{margin-top:6px;text-align:center;font-size:11px;letter-spacing:2px;color:#f6dfa4;
  background:linear-gradient(180deg,#2f353d,#171b21);border-radius:6px;padding:4px 8px;
  box-shadow:inset 0 0 0 1px rgba(243,195,74,.45), inset 0 2px 6px rgba(0,0,0,.7)}
.result{margin-top:6px;border-radius:10px;padding:7px 10px;text-align:center;
  background:linear-gradient(180deg,#c9192b,#7d0c18 55%,#a71424);
  box-shadow:inset 0 0 0 3px #e3bc5c, inset 0 0 0 5px #7d5a0d,
             0 4px 14px rgba(0,0,0,.55), 0 0 22px rgba(200,30,40,.3)}
.result .rtxt{font-size:21px;line-height:1.06;color:#ffe9a8;letter-spacing:.5px;
  text-shadow:0 0 10px rgba(255,190,80,.85),0 2px 0 #5c0810;white-space:nowrap}
.result .rtxt small{font-size:13px;letter-spacing:2px;display:block;color:#ffcf7a;margin-bottom:3px}
.result.flash{animation:rflash .7s ease-out}
@keyframes rflash{0%{background:#fff6dc}45%{background:linear-gradient(180deg,#e8443f,#7d0c18)}
  100%{background:linear-gradient(180deg,#c9192b,#7d0c18 55%,#a71424)}}

/* lever */
.lever{position:absolute;right:0;top:150px;width:44px;height:220px;z-index:2}
.lever .pivot{position:absolute;left:4px;top:140px;width:24px;height:24px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#c9a13a 55%,#6b4c05);
  box-shadow:0 2px 6px rgba(0,0,0,.6)}
.lever .rodwrap{position:absolute;left:11px;top:20px;width:9px;height:132px;
  transform-origin:50% 100%;transition:transform .55s cubic-bezier(.3,1.4,.5,1)}
.lever.pull .rodwrap{transform:rotate(58deg)}
.lever .rod{position:absolute;inset:0;border-radius:5px;
  background:linear-gradient(90deg,#5d6672,#eef2f6 38%,#aab3bd 62%,#4a525d)}
.lever .knob{position:absolute;left:-11px;top:-30px;width:31px;height:42px;
  border-radius:50% / 40% 40% 60% 60%;transform:rotate(-8deg);
  background:radial-gradient(circle at 34% 26%, #b6703d, #7a3f1c 55%, #3c1d0a);
  box-shadow:inset 0 -5px 9px rgba(0,0,0,.55), inset 0 3px 6px rgba(255,190,140,.25),
             0 3px 8px rgba(0,0,0,.6)}
.lever .knob::before{content:"";position:absolute;left:50%;margin-left:-1.2px;top:11px;
  width:2.4px;height:21px;background:#f3ece0;border-radius:2px}
.lever .knob::after{content:"";position:absolute;left:9px;right:9px;top:12px;height:19px;
  background:repeating-linear-gradient(180deg,#f3ece0 0 2px,transparent 2px 6.5px)}

/* ---------- board ---------- */
.boardwrap{margin-top:8px;width:408px;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.bhead{display:flex;align-items:center;gap:8px;margin-bottom:4px;padding:0 3px}
.bhead h2{font-size:11px;letter-spacing:2.4px;color:#f3c34a;white-space:nowrap}
.bhead .line{flex:1;height:2px;background:linear-gradient(90deg,rgba(243,195,74,.7),transparent)}
.bhead .cnt{font-size:10px;color:#8fa5c8;letter-spacing:1px}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:3px 6px;align-content:start}
.pick{display:flex;align-items:center;gap:6px;border-radius:5px;padding:2px 6px;min-height:22px;
  background:linear-gradient(180deg,rgba(28,48,86,.85),rgba(12,24,46,.85));
  box-shadow:inset 0 0 0 1px rgba(120,160,220,.18)}
.pick.empty{opacity:.32}
.pick .n{font-size:10px;color:#0d1424;background:linear-gradient(180deg,#f3c34a,#b8860f);
  border-radius:3px;padding:2px 4px;min-width:20px;text-align:center;letter-spacing:.5px}
.pick .who{font-family:Georgia,serif;font-weight:700;font-size:13.5px;color:#eaf2ff;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick.empty .who{font-family:inherit;font-size:10px;letter-spacing:1.5px;color:#7d90b0}
.pick.fresh{animation:freshin .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes freshin{0%{transform:scale(.8);background:#f3c34a}
  40%{background:rgba(243,195,74,.55)}
  100%{transform:scale(1);background:linear-gradient(180deg,rgba(28,48,86,.85),rgba(12,24,46,.85))}}

/* ---------- overlays ---------- */
#confetti{position:absolute;inset:0;width:432px;height:768px;pointer-events:none;z-index:20}
.ov{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;
  background:radial-gradient(90% 60% at 50% 22%, rgba(20,44,88,.97), rgba(4,8,16,.985));
  backdrop-filter:blur(3px);padding:16px 14px}
.ov.show{display:flex;animation:fade .45s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.ov h1{text-align:center;font-size:26px;color:#ffd873;letter-spacing:1px;line-height:1.05;
  text-shadow:0 0 12px rgba(255,170,40,.75),0 0 34px rgba(255,110,0,.5)}
.ov .sub{text-align:center;font-size:10px;letter-spacing:3px;color:#8fb2e0;margin:5px 0 10px}
.finalgrid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:1fr;gap:5px;
  padding:4px 2px}
.frow{display:flex;align-items:center;gap:9px;padding:5px 9px;border-radius:7px;
  background:linear-gradient(90deg,rgba(30,54,98,.92),rgba(12,24,46,.75));
  box-shadow:inset 0 0 0 1px rgba(130,170,230,.2)}
.frow .fn{font-size:12px;min-width:30px;text-align:center;border-radius:4px;padding:3px 0;
  color:#12161d;background:linear-gradient(180deg,#dfe7f0,#96a4b5)}
.frow .fw{font-family:Georgia,serif;font-weight:700;font-size:19px;color:#f2f7ff}
.frow.top1{background:linear-gradient(90deg,#8a6510,#3c2a05);
  box-shadow:inset 0 0 0 1px rgba(255,215,120,.75),0 0 16px rgba(255,180,50,.28)}
.frow.top1 .fn{background:linear-gradient(180deg,#ffe89a,#d9a422)}
.frow.top1 .fw{color:#ffe9a8;text-shadow:0 0 10px rgba(255,190,80,.7)}
.frow.top1::after{content:"1ST OVERALL";margin-left:auto;font-size:8px;letter-spacing:1.6px;color:#ffd873}
.ovbtns{display:flex;gap:8px;margin-top:12px}
.ovbtn{flex:1;padding:11px 6px;border:none;border-radius:8px;cursor:pointer;font-family:inherit;
  font-size:12px;letter-spacing:1.6px;color:#fff3d6;
  background:linear-gradient(180deg,#d43a2a,#8b1a14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 0 #4d0d09,0 6px 14px rgba(0,0,0,.5)}
.ovbtn.gold{background:linear-gradient(180deg,#f0cf6a,#b8860f);color:#3b2600;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 0 #6b4c05,0 6px 14px rgba(0,0,0,.5)}
.ovbtn:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 0 #4d0d09}

/* settings */
#setup .fld{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0}
#setup textarea{flex:1;min-height:0;resize:none;border-radius:9px;padding:11px 12px;
  background:#0a1426;color:#eaf2ff;border:1px solid rgba(140,180,240,.3);
  font-family:Georgia,serif;font-size:16px;line-height:1.65;letter-spacing:.4px;outline:none}
#setup textarea:focus{border-color:#f3c34a;box-shadow:0 0 0 2px rgba(243,195,74,.25)}
#setup .hint{font-size:9.5px;letter-spacing:1.1px;color:#8fb2e0;line-height:1.6}
#setup .err{font-size:10px;color:#ff8a7a;letter-spacing:.8px;min-height:13px}
</style>
</head>
<body>

<div id="stage">
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="field"></div>
  <div id="starfield"></div>

  <div class="wrap">

    <!-- ============ MARQUEE ============ -->
    <div class="marquee">
      <div class="topper">
        <div class="arch"></div>
        <div id="topperNum">12</div>
      </div>
      <div class="board-frame" id="mqFrame">
        <div class="matrix">
          <div class="mq-text">GVR DRAFT<br>LOTTERY</div>
        </div>
      </div>
    </div>

    <!-- ============ MACHINE ============ -->
    <div class="machine-area">
      <div class="lever" id="lever">
        <div class="rodwrap"><div class="rod"></div><div class="knob"></div></div>
        <div class="pivot"></div>
      </div>

      <div class="machine" id="machine">
        <div class="rail l" id="railL"></div>
        <div class="rail r" id="railR"></div>

        <div class="readouts">
          <div class="readout"><span>ON THE CLOCK</span><b id="pickNum">12</b></div>
          <div class="readout"><span>REMAINING</span><b id="leftNum">12</b></div>
        </div>

        <div class="reel-frame">
          <div class="arrow l"></div>
          <div class="arrow r"></div>
          <div class="reel-window" id="reelWindow">
            <div class="reel-strip" id="reelStrip"></div>
            <div class="payline" id="payline"></div>
            <div class="glass"></div>
          </div>
        </div>

        <div class="deck">
          <button class="aux" id="soundBtn" title="Sound on/off">SFX</button>
          <button class="spin-btn ready" id="spinBtn">SPIN</button>
          <button class="aux gold" id="gearBtn" title="Edit names">EDIT</button>
        </div>

        <div class="ribbon" id="ribbon">PICK YOUR DRAFT ORDER</div>

        <div class="result" id="result">
          <div class="rtxt" id="resultTxt">SPIN TO WIN!</div>
        </div>
      </div>
    </div>

    <!-- ============ BOARD ============ -->
    <div class="boardwrap">
      <div class="bhead">
        <h2>DRAFT BOARD</h2>
        <div class="line"></div>
        <div class="cnt" id="boardCnt">0 / 12</div>
      </div>
      <div class="picks" id="picks"></div>
    </div>
  </div>

  <canvas id="confetti"></canvas>

  <!-- ============ FINAL ============ -->
  <div class="ov" id="finalOv">
    <h1>FINAL DRAFT ORDER</h1>
    <div class="sub">GVR FANTASY FOOTBALL</div>
    <div class="finalgrid" id="finalGrid"></div>
    <div class="ovbtns">
      <button class="ovbtn gold" id="copyBtn">COPY LIST</button>
      <button class="ovbtn" id="againBtn">RUN IT AGAIN</button>
    </div>
  </div>

  <!-- ============ SETTINGS ============ -->
  <div class="ov" id="setup">
    <h1>TEAM NAMES</h1>
    <div class="sub">ONE PER LINE</div>
    <div class="fld">
      <textarea id="namesBox" spellcheck="false"></textarea>
      <div class="hint">Short names read best on the reel &mdash; 6 characters or less.<br>
        Saving resets the lottery and re-rolls the whole draft order.</div>
      <div class="err" id="setupErr"></div>
    </div>
    <div class="ovbtns">
      <button class="ovbtn" id="cancelBtn">CANCEL</button>
      <button class="ovbtn gold" id="saveBtn">SAVE &amp; RESET</button>
    </div>
  </div>
</div>

<script>
"use strict";

/* ============================================================
   1. THE ROSTER  — edit this list, or use the EDIT button in the app.
   Each name is drawn exactly once: the winner is spliced out of `pool`
   the moment it lands, so it can never come up on a later spin.
   ============================================================ */
let NAMES = [
  "Taylor", "Kirch", "Val",   "Nate",
  "Katie",  "Greg",  "Augie", "Aaron",
  "Cesar",  "Fran",  "Mel",   "Colin"
];

/* ============================================================
   2. Tunables
   ============================================================ */
const CELL_H      = 56;    // px per reel cell (must match .cell height in CSS)
const SPIN_MS     = 3400;  // base spin duration
const SPIN_JITTER = 400;   // random extra ms
const PHASE1      = 0.87;  // fraction of the spin spent decelerating to the overshoot
const OVERSHOOT   = 22;    // px past the target before it settles back
const FILL_MIN    = 74;    // minimum filler cells before the winner

/* ============================================================
   3. State
   ============================================================ */
const $ = function (id) { return document.getElementById(id); };

let pool = [];        // names still available
let results = [];     // [{pick, name}] in reveal order (12 -> 1)
let spinning = false;
let centerName = "";  // what is currently sitting on the payline
let soundOn = true;

const stage      = $("stage");
const reelStrip  = $("reelStrip");
const spinBtn    = $("spinBtn");
const payline    = $("payline");
const machine    = $("machine");
const lever      = $("lever");
const resultEl   = $("result");
const resultTxt  = $("resultTxt");

/* ============================================================
   4. Stage scaling — keeps the 9:16 composition identical everywhere
   ============================================================ */
function fitStage() {
  const s = Math.min(window.innerWidth / 432, window.innerHeight / 768);
  stage.style.transform = "scale(" + s + ")";
  stage.style.left = ((window.innerWidth  - 432 * s) / 2) + "px";
  stage.style.top  = ((window.innerHeight - 768 * s) / 2) + "px";
}
window.addEventListener("resize", fitStage);
window.addEventListener("orientationchange", function(){ setTimeout(fitStage, 120); });

/* ============================================================
   5. Decor: starfield + marquee bulbs
   ============================================================ */
function buildStars() {
  const host = $("starfield");
  let html = "";
  for (let i = 0; i < 34; i++) {
    const x = Math.random() * 432, y = Math.random() * 430;
    html += '<div class="star" style="left:' + x.toFixed(1) + 'px;top:' + y.toFixed(1) +
            'px;animation-delay:' + (Math.random() * 3.4).toFixed(2) + 's"></div>';
  }
  host.innerHTML = html;
}

/** Ring of bulbs around an element's perimeter. */
function ringBulbs(el, spacing) {
  const w = el.offsetWidth, h = el.offsetHeight;
  const nx = Math.max(2, Math.round(w / spacing));
  const ny = Math.max(2, Math.round(h / spacing));
  const pts = [];
  for (let i = 0; i < nx; i++) {
    const x = (i + 0.5) * (w / nx);
    pts.push([x, 0]); pts.push([x, h]);
  }
  for (let j = 0; j < ny; j++) {
    const y = (j + 0.5) * (h / ny);
    pts.push([0, y]); pts.push([w, y]);
  }
  let html = "";
  pts.forEach(function (p, i) {
    html += '<div class="bulb' + (i % 2 ? " odd" : "") + '" style="left:' +
            p[0].toFixed(1) + 'px;top:' + p[1].toFixed(1) + 'px"></div>';
  });
  el.insertAdjacentHTML("beforeend", html);
}

/** Column of bulbs down a side rail. */
function railBulbs(el, count) {
  let html = "";
  for (let i = 0; i < count; i++) {
    html += '<div class="bulb' + (i % 2 ? " odd" : "") + '" style="top:' +
            (((i + 0.5) / count) * 100).toFixed(2) + '%"></div>';
  }
  el.insertAdjacentHTML("beforeend", html);
}

/* ============================================================
   6. Sound (synthesised — no files, no dependencies)
   ============================================================ */
let actx = null;
function audio() {
  if (!soundOn) return null;
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
  }
  if (actx.state === "suspended") actx.resume();
  return actx;
}
function tick() {
  const c = audio(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = "square"; o.frequency.value = 1100 + Math.random() * 260;
  g.gain.setValueAtTime(0.05, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0007, c.currentTime + 0.035);
  o.connect(g); g.connect(c.destination);
  o.start(); o.stop(c.currentTime + 0.04);
}
function chime() {
  const c = audio(); if (!c) return;
  [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
    const o = c.createOscillator(), g = c.createGain();
    const t = c.currentTime + i * 0.07;
    o.type = "triangle"; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.17, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 0.55);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 0.6);
  });
}
function fanfare() {
  const c = audio(); if (!c) return;
  [392, 523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function (f, i) {
    const o = c.createOscillator(), g = c.createGain();
    const t = c.currentTime + i * 0.1;
    o.type = "sawtooth"; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.12, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 0.8);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 0.9);
  });
}

/* ============================================================
   7. Confetti
   ============================================================ */
const cvs = $("confetti"), ctx = cvs.getContext("2d");
cvs.width = 432 * 2; cvs.height = 768 * 2; ctx.scale(2, 2);
let parts = [], rafConfetti = 0;
const CONF_COLORS = ["#f3c34a", "#ffe89a", "#c9192b", "#ef4459", "#ffffff", "#ff8b2e", "#8fb2e0"];

function burst(cx, cy, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 2.5 + Math.random() * 8.5;
    parts.push({
      x: cx, y: cy,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 3.5,
      w: 4 + Math.random() * 6,
      h: 3 + Math.random() * 5,
      rot: Math.random() * 6.28,
      vr: (Math.random() - 0.5) * 0.4,
      life: 1,
      decay: 0.006 + Math.random() * 0.008,
      c: CONF_COLORS[(Math.random() * CONF_COLORS.length) | 0]
    });
  }
  if (!rafConfetti) rafConfetti = requestAnimationFrame(stepConfetti);
}
function stepConfetti() {
  ctx.clearRect(0, 0, 432, 768);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.vy += 0.19; p.vx *= 0.99; p.vy *= 0.995;
    p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= p.decay;
    if (p.life <= 0 || p.y > 800) { parts.splice(i, 1); continue; }
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
    ctx.fillStyle = p.c;
    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * (0.4 + 0.6 * Math.abs(Math.cos(p.rot))));
    ctx.restore();
  }
  rafConfetti = parts.length ? requestAnimationFrame(stepConfetti) : 0;
  if (!rafConfetti) ctx.clearRect(0, 0, 432, 768);
}

/* ============================================================
   8. Helpers
   ============================================================ */
function shuffled(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }
function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function setY(y) { reelStrip.style.transform = "translate3d(0," + (-y) + "px,0)"; }

/* ============================================================
   9. Reel
   ============================================================ */
/**
 * Build the strip for one spin.
 *  - index 1 holds whatever is currently on the payline, so the reel
 *    starts from a standstill with no visual jump (target Y for index 1 is 0).
 *  - the winner sits at a known index; the animation ends on exactly that
 *    index's offset, so it can never drift or stop between two names.
 */
function buildStrip(winner) {
  const cells = [];
  const all = NAMES;

  cells.push(pick(all));                                  // 0 (above the window)
  cells.push(centerName || pick(all));                    // 1 = current payline

  const fill = FILL_MIN + ((Math.random() * 10) | 0);
  // Bulk filler: everything in the league, so the reel always looks full.
  while (cells.length < 2 + fill - 6) {
    const batch = shuffled(all);
    for (let i = 0; i < batch.length && cells.length < 2 + fill - 6; i++) {
      if (batch[i] !== cells[cells.length - 1]) cells.push(batch[i]);
    }
  }
  // Last few before the winner come from the live pool, so as it slows down
  // you see actual candidates go by.
  const tailPool = pool.length >= 3 ? pool : all;
  for (let i = 0; i < 6; i++) {
    let n = pick(tailPool), guard = 0;
    while ((n === cells[cells.length - 1] || (i === 5 && n === winner)) && guard++ < 12) n = pick(tailPool);
    cells.push(n);
  }

  const winIndex = cells.length;
  cells.push(winner);

  // trailing cells so the row below the winner is never blank
  for (let i = 0; i < 3; i++) {
    let n = pick(all), guard = 0;
    while (n === cells[cells.length - 1] && guard++ < 12) n = pick(all);
    cells.push(n);
  }

  let html = "";
  for (let i = 0; i < cells.length; i++) {
    html += '<div class="cell' + (i === winIndex ? "" : " dim") + '">' + cells[i] + "</div>";
  }
  reelStrip.innerHTML = html;
  setY(0);
  return winIndex;
}

function spin() {
  if (spinning || pool.length === 0) return;
  spinning = true;
  spinBtn.disabled = true;
  spinBtn.classList.remove("ready");
  spinBtn.classList.add("press");
  setTimeout(function () { spinBtn.classList.remove("press"); }, 130);
  lever.classList.add("pull");
  setTimeout(function () { lever.classList.remove("pull"); }, 620);
  document.body.classList.add("hot");
  $("ribbon").textContent = "SPINNING…";
  resultTxt.innerHTML = "&#9679; &nbsp;&#9679;&nbsp; &#9679;";

  // ---- pick the winner up front, then animate to it exactly ----
  const winner   = pool[(Math.random() * pool.length) | 0];
  const winIndex = buildStrip(winner);
  const cells    = reelStrip.children;

  const startY = 0;
  const endY   = (winIndex - 1) * CELL_H;   // puts winIndex on the middle row
  const peakY  = endY + OVERSHOOT;
  const dur    = SPIN_MS + Math.random() * SPIN_JITTER;
  const t0     = performance.now();

  let lastCell = 0, lastTick = 0, lastY = 0;

  function frame(now) {
    const t = (now - t0) / dur;

    if (t >= 1) {
      setY(endY);                    // exact landing, always
      reelStrip.classList.remove("blur", "blur2");
      land(winner, winIndex, cells);
      return;
    }

    let y;
    if (t < PHASE1) {
      y = startY + (peakY - startY) * easeOutQuart(t / PHASE1);
    } else {
      y = peakY + (endY - peakY) * easeOutCubic((t - PHASE1) / (1 - PHASE1));
    }
    setY(y);

    // speed-based motion blur
    const v = Math.abs(y - lastY); lastY = y;
    reelStrip.classList.toggle("blur2", v > 26);
    reelStrip.classList.toggle("blur", v > 9 && v <= 26);

    // one tick per cell that passes, throttled so it stays a rattle not a buzz
    const cellIdx = Math.floor(y / CELL_H);
    if (cellIdx !== lastCell) {
      lastCell = cellIdx;
      if (now - lastTick > 42) { lastTick = now; tick(); }
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function land(winner, winIndex, cells) {
  spinning = false;
  document.body.classList.remove("hot");
  centerName = winner;

  // remove from the pool
  const at = pool.indexOf(winner);
  if (at > -1) pool.splice(at, 1);

  const pickNo = pool.length + 1;         // 12 down to 1
  results.push({ pick: pickNo, name: winner });

  // ---- landing effects ----
  cells[winIndex].classList.remove("dim");
  cells[winIndex].classList.add("win");
  payline.classList.remove("win"); void payline.offsetWidth; payline.classList.add("win");
  machine.classList.remove("shake"); void machine.offsetWidth; machine.classList.add("shake");
  resultEl.classList.remove("flash"); void resultEl.offsetWidth; resultEl.classList.add("flash");
  burst(216, 300, 90);
  chime();

  resultTxt.innerHTML = "<small>PICK #" + pickNo + "</small>" + winner.toUpperCase();
  $("ribbon").textContent = pool.length
    ? "PICK #" + pool.length + " IS UP NEXT"
    : "THAT'S THE BOARD";

  renderBoard(true);
  updateCounters();

  if (pool.length === 0) {
    spinBtn.disabled = true;
    setTimeout(showFinal, 1250);
  } else {
    setTimeout(function () {
      spinBtn.disabled = false;
      spinBtn.classList.add("ready");
    }, 620);
  }
}

/* ============================================================
   10. Board / counters / final screen
   ============================================================ */
function updateCounters() {
  const next = pool.length ? pool.length : 1;
  $("pickNum").textContent = pool.length ? next : "—";
  $("leftNum").textContent = pool.length;
  $("boardCnt").textContent = results.length + " / " + NAMES.length;

  const topper = $("topperNum");
  const label = pool.length ? String(next) : "★";
  if (topper.textContent !== label) {
    topper.textContent = label;
    topper.classList.remove("pop"); void topper.offsetWidth; topper.classList.add("pop");
    setTimeout(function () { topper.classList.remove("pop"); }, 240);
  }
}

function renderBoard(animateLast) {
  const host = $("picks");
  let html = "";
  for (let i = 0; i < NAMES.length; i++) {
    const pickNo = NAMES.length - i;              // 12, 11, 10 ...
    const r = results[i];
    if (r) {
      const fresh = (animateLast && i === results.length - 1) ? " fresh" : "";
      html += '<div class="pick' + fresh + '"><span class="n">' + r.pick +
              '</span><span class="who">' + r.name + "</span></div>";
    } else {
      html += '<div class="pick empty"><span class="n">' + pickNo +
              '</span><span class="who">— — —</span></div>';
    }
  }
  host.innerHTML = html;
}

function showFinal() {
  const order = results.slice().sort(function (a, b) { return a.pick - b.pick; });
  let html = "";
  order.forEach(function (r) {
    html += '<div class="frow' + (r.pick === 1 ? " top1" : "") + '"><span class="fn">' +
            r.pick + '</span><span class="fw">' + r.name + "</span></div>";
  });
  $("finalGrid").innerHTML = html;
  $("finalOv").classList.add("show");
  fanfare();
  burst(150, 210, 70); burst(290, 190, 70);
  setTimeout(function () { burst(216, 150, 80); }, 420);
}

/* ============================================================
   11. Reset / settings
   ============================================================ */
function reset() {
  pool = NAMES.slice();
  results = [];
  spinning = false;
  parts = [];
  ctx.clearRect(0, 0, 432, 768);

  const idle = shuffled(NAMES).slice(0, 3);
  while (idle.length < 3) idle.push(NAMES[idle.length % NAMES.length]);
  centerName = idle[1];
  reelStrip.innerHTML =
    '<div class="cell dim">' + idle[0] + '</div>' +
    '<div class="cell">' + idle[1] + '</div>' +
    '<div class="cell dim">' + idle[2] + '</div>';
  setY(0);

  resultTxt.textContent = "SPIN TO WIN!";
  $("ribbon").textContent = "PICK YOUR DRAFT ORDER";
  spinBtn.disabled = false;
  spinBtn.classList.add("ready");
  $("finalOv").classList.remove("show");
  renderBoard(false);
  updateCounters();
}

function openSetup() {
  $("namesBox").value = NAMES.join("\n");
  $("setupErr").textContent = "";
  $("setup").classList.add("show");
}
function saveSetup() {
  const lines = $("namesBox").value.split("\n")
    .map(function (s) { return s.trim(); })
    .filter(function (s) { return s.length > 0; });

  if (lines.length < 2) {
    $("setupErr").textContent = "Need at least 2 names.";
    return;
  }
  const seen = {};
  for (let i = 0; i < lines.length; i++) {
    const k = lines[i].toLowerCase();
    if (seen[k]) { $("setupErr").textContent = 'Duplicate name: "' + lines[i] + '"'; return; }
    seen[k] = 1;
    if (lines[i].length > 9) {
      $("setupErr").textContent = '"' + lines[i] + '" is too long for the reel (9 max).';
      return;
    }
  }
  NAMES = lines;
  $("setup").classList.remove("show");
  reset();
}

/* ============================================================
   12. Wiring
   ============================================================ */
spinBtn.addEventListener("click", spin);
$("againBtn").addEventListener("click", reset);
$("gearBtn").addEventListener("click", openSetup);
$("cancelBtn").addEventListener("click", function () { $("setup").classList.remove("show"); });
$("saveBtn").addEventListener("click", saveSetup);

$("copyBtn").addEventListener("click", function () {
  const order = results.slice().sort(function (a, b) { return a.pick - b.pick; });
  const text = "GVR DRAFT ORDER\n" + order.map(function (r) {
    return r.pick + ". " + r.name;
  }).join("\n");
  const btn = $("copyBtn");
  function done() { btn.textContent = "COPIED!"; setTimeout(function () { btn.textContent = "COPY LIST"; }, 1600); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
  } else fallbackCopy(text, done);
});
function fallbackCopy(text, cb) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); cb(); } catch (e) {}
  document.body.removeChild(ta);
}

$("soundBtn").addEventListener("click", function () {
  soundOn = !soundOn;
  this.textContent = soundOn ? "SFX" : "MUTE";
  this.style.filter = soundOn ? "" : "saturate(.25) brightness(.75)";
  if (soundOn) tick();
});

document.addEventListener("keydown", function (e) {
  if (e.code === "Space" || e.code === "Enter") {
    const setupOpen = $("setup").classList.contains("show");
    if (setupOpen) return;
    e.preventDefault();
    if ($("finalOv").classList.contains("show")) reset();
    else if (!spinBtn.disabled) spin();
  }
});

/* ============================================================
   13. Boot
   ============================================================ */
fitStage();
buildStars();
ringBulbs($("mqFrame"), 17);
railBulbs($("railL"), 11);
railBulbs($("railR"), 11);
reset();
</script>
</body>
</html>
